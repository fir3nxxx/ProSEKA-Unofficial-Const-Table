<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEKAI FORCE Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @font-face {
    font-family: 'Cafe24SurroundAir';
    src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Cafe24Surround';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  } 

  body {
    font-family: 'Cafe24SurroundAir', sans-serif;
    background-color: #121212;
    color: #ffffff;
    margin: 0;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
  }
  .main-container {
    max-width: 1300px;
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
    border-radius: 12px;
    background-color: #121212; 
  }
  h1 {
    text-align: center;
    color: #0bc;
    font-size: 28px;
    margin-bottom: 30px;
    font-weight: 800;
  }
  .content-wrapper {
    display: flex;
    gap: 30px;
    align-items: flex-start;
  }
  .left-panel {
    flex: 3;
    background: #1e1e1e;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .right-panel {
    flex: 1;
    position: sticky;
    top: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    min-width: 320px;
  }
  .tabs {
    display: flex;
    margin-bottom: 20px;
    border-bottom: 2px solid #333;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
    color: #888;
    transition: 0.3s;
  }
  .tab.active {
    color: #0bc;
    border-bottom: 2px solid #0bc;
  }

  .horizontal-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #252525;
    border-radius: 8px;
    border: 1px solid #333;
    transition: all 0.3s ease;
    gap: 8px;
  }
  
  .row.glow-ap {
    border-color: #81fafa;
    background: linear-gradient(135deg, rgba(129, 242, 250, 0.15), rgba(129, 246, 250, 0.05));
    box-shadow: 0 0 12px rgba(129, 246, 250, 0.4);
  }
  .row.glow-fc {
    border-color: #ff80ab;
    background: linear-gradient(135deg, rgba(255, 128, 171, 0.15), rgba(255, 128, 171, 0.05));
    box-shadow: 0 0 12px rgba(255, 128, 171, 0.4);
  }

  .capture-hide {
    display: none !important;
  }

  .level-label {
    font-size: 13px;
    font-weight: bold;
    padding: 4px 6px;
    border-radius: 6px;
    text-align: center;
    min-width: 75px;
    box-sizing: border-box;
    white-space: nowrap;
  }
  .input-group {
    display: flex;
    gap: 10px;
  }
  .input-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .input-item label {
    font-size: 12px;
    color: #aaa;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pts {
    font-size: 11px;
    margin-top: 2px;
  }
  input[type="number"], input[type="text"] {
    font-family: inherit; 
    background: #121212;
    border: 1px solid #555;
    color: #fff;
    border-radius: 6px;
  }
  input[type="number"] {
    width: 45px;
    padding: 6px;
    text-align: center;
    font-size: 14px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    box-sizing: border-box;
  }
  input:focus {
    outline: none;
    border-color: #0bc;
  }
  
  .nickname-box {
    background: #1e1e1e;
    padding: 15px 20px;
    border-radius: 12px;
    border: 1px solid #333;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .nickname-box label {
    display: block;
    font-size: 14px;
    color: #aaa;
    margin-bottom: 8px;
    font-weight: bold;
  }

  .result-box {
    padding: 25px 20px;
    background: #1e1e1e;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    border: 1px solid #333;
  }
  .result-title {
    font-size: 16px;
    color: #aaa;
  }
  .result-score {
    font-size: 44px;
    font-weight: bold;
    background: linear-gradient(90deg, #3cb, #0bc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 15px 0;
  }
  .result-rank {
    font-size: 20px;
    color: #fff;
    font-weight: bold;
  }
  .next-rank {
    font-size: 13px;
    color: #888;
    margin-top: 10px;
  }

  .major-achievements-box {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #333;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .major-achievements-title {
    font-size: 14px;
    color: #aaa;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .jackets-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    width: 100%;
  }
  .jacket-slot {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    box-sizing: border-box;
  }
  .jacket-card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 8px;
    overflow: hidden;
    background-color: #252525;
    display: block;
    cursor: pointer;
  }
  .jacket-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  .jacket-shadow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .card-level-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 11px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    z-index: 2;
  }
  .card-rank-text {
    position: absolute;
    bottom: 6px;
    left: 8px;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    z-index: 2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
  .card-score-text {
    position: absolute;
    bottom: 6px;
    right: 6px;
    font-size: 11px;
    font-weight: bold;
    z-index: 2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
  .btn-add-jacket {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: bold;
    background-color: #333; 
    color: #ddd;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }
  .btn-add-jacket:hover {
    background: #444;
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.75);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .modal-content {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #444;
    width: 320px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }
  .modal-content h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 16px;
    color: #0bc;
  }
  .modal-footer {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-find-link {
    color: #aaa;
    font-size: 12px;
    text-decoration: underline;
  }
  .modal-find-link:hover {
    color: #0bc;
  }
  .modal-buttons {
    display: flex;
    gap: 6px;
  }

  .info-box {
    display: none;
    background: rgba(255, 235, 59, 0.1);
    border: 1px solid #ffeb3b;
    color: #ffd600;
    padding: 12px 15px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    font-weight: bold;
    word-break: keep-all;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    font-family: inherit; 
    flex: 1;
    min-width: 45%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-save { background-color: #0bc; color: #fff; }
  .btn-save:hover { background-color: #0096A3; }
  .btn-load { background-color: #333; color: #ddd; border: 1px solid #555; }
  .btn-load:hover { background-color: #444; }
  .btn-reset { background-color: #f44336; color: #fff; }
  .btn-reset:hover { background-color: #d32f2f; }
  .btn-capture { background-color: #2196F3; color: #fff; flex-basis: 100%; }
  .btn-capture:hover { background-color: #1e88e5; }

  @media (max-width: 1100px) {
    .content-wrapper { flex-direction: column; }
    .right-panel { position: static; width: 100%; }
    .horizontal-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .horizontal-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="main-container" id="capture-area">
  <h1><span style="font-family: 'Cafe24Surround', sans-serif;">SEKAI FORCE Calculator</span></h1>
  
  <div class="content-wrapper">
    <div class="left-panel">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('mas', event)">MASTER 이하 (39곡)</div>
        <div class="tab" onclick="switchTab('apd', event)">APPEND (26곡)</div>
      </div>
      <div id="input-container" class="horizontal-grid">
        <!-- JS 동적 생성 -->
      </div>
    </div>

    <div class="right-panel">
      <div class="nickname-box">
        <label for="nickname-input">닉네임</label>
        <input type="text" id="nickname-input" placeholder="세카이의 주민">
      </div>

      <div class="result-box">
        <div class="result-title">최종 SEKAI FORCE</div>
        <div class="result-score" id="final-score">0.0</div>
        <div class="result-rank" id="final-rank">언랭크</div>
        <div class="next-rank" id="next-rank">다음 등급까지 남은 점수: 2000.0</div>
      </div>

      <div class="major-achievements-box">
        <div class="major-achievements-title">주요 성과</div>
        <div class="jackets-grid" id="jackets-grid">
          <!-- JS 동적 생성 -->
        </div>
      </div>

      <div id="info-box" class="info-box"></div>

      <div class="btn-group" id="action-buttons">
        <button class="btn btn-save" onclick="saveData()">기록 저장</button>
        <button class="btn btn-load" onclick="loadData()">불러오기</button>
        <button class="btn btn-reset" onclick="resetData()">내역 초기화</button>
        <button class="btn btn-capture" onclick="captureScreen()">이미지 출력 (데스크톱 환경 권장)</button>
      </div>
    </div>
  </div>
</div>

<div id="jacket-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h3>자켓 이미지 ID 또는 URL 입력</h3>
    <input type="text" id="modal-id-input" placeholder="곡 ID 숫자 또는 이미지 URL 주소" style="width: 100%; padding: 10px; box-sizing: border-box; margin-top: 5px;">
    <div class="modal-footer">
      <a href="https://rilakbest.com/song/list/all" target="_blank" class="modal-find-link">ID 찾기 #</a>
      <div class="modal-buttons">
        <button class="btn btn-save" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="submitJacketId()">확인</button>
        <button class="btn btn-reset" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="deleteJacketId()">삭제</button>
        <button class="btn btn-load" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="closeJacketModal()">취소</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentMode = 'mas';

  const jacketMap = {};
  const badgeColorState = {};
  let activeModalKey = null;

  const ranks = [
    { name: "비기너 I", min: 2000 },
    { name: "비기너 II", min: 2500 },
    { name: "비기너 III", min: 3000 },
    { name: "비기너 IV", min: 3500 },
    { name: "브론즈 I", min: 4000 },
    { name: "브론즈 II", min: 4500 },
    { name: "브론즈 III", min: 5000 },
    { name: "브론즈 IV", min: 5500 },
    { name: "실버 I", min: 6000 },
    { name: "실버 II", min: 6250 },
    { name: "실버 III", min: 6500 },
    { name: "실버 IV", min: 6750 },
    { name: "골드 I", min: 7000 },
    { name: "골드 II", min: 7250 },
    { name: "골드 III", min: 7500 },
    { name: "골드 IV", min: 7750 },
    { name: "플래티넘 I", min: 8000 },
    { name: "플래티넘 II", min: 8250 },
    { name: "플래티넘 III", min: 8500 },
    { name: "플래티넘 IV", min: 8750 },
    { name: "다이아몬드 I", min: 9000 },
    { name: "다이아몬드 II", min: 9150 },
    { name: "다이아몬드 III", min: 9300 },
    { name: "다이아몬드 IV", min: 9450 },
    { name: "마스터 I", min: 9600 },
    { name: "마스터 II", min: 9700 },
    { name: "마스터 III", min: 9800 },
    { name: "마스터 IV", min: 9900 },
    { name: "챔피언", min: 10000 },
    { name: "챔피언+", min: 10500 }
  ]; 

  const dataMAS = {};
  const dataAPD = {};

  function init() {
    for (let i = 17; i <= 37; i++) dataMAS[i] = { fc: 0, ap: 0 };
    for (let i = 24; i <= 38; i++) dataAPD[i] = { fc: 0, ap: 0 };

    renderInputs();
    calculate();
  }

  function switchTab(mode, event) {
    currentMode = mode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    renderInputs();
    calculate();
  }

  function getGlowClass(data) {
    if (data.ap > 0) return 'glow-ap';
    if (data.fc > 0) return 'glow-fc';
    return '';
  }

  function renderInputs() {
    const container = document.getElementById('input-container');
    container.innerHTML = '';
    
    let levels = currentMode === 'mas' 
      ? Object.keys(dataMAS).map(Number).sort((a, b) => b - a)
      : Object.keys(dataAPD).map(Number).sort((a, b) => b - a);

    const multiplier = currentMode === 'apd' ? 1.42 : 1.0;
    const lvlPrefix = currentMode === 'apd' ? 'Lv.APD' : 'Lv.';

    levels.forEach(level => {
      const data = currentMode === 'mas' ? dataMAS[level] : dataAPD[level];
      const fcPts = (level * 7.5 * multiplier).toFixed(1);
      const apPts = (level * 8.0 * multiplier).toFixed(1);
      const glowClass = getGlowClass(data);
      
      let badgeBg = '';
      let badgeColor = '#fff';
      if (currentMode === 'mas') {
        if (level >= 27 && level <= 37) {
          badgeBg = '#c3fd';
        } else if (level >= 22 && level <= 26) {
          badgeBg = '#f47d';
        } else if (level >= 17 && level <= 21) {
          badgeBg = '#fc0d';
          badgeColor = '#121212';
        }
      } else {
        badgeBg = '#f7c';
      }
      
      const row = document.createElement('div');
      row.className = `row ${glowClass}`;
      row.id = `row-${currentMode}-${level}`;
      
      row.innerHTML = `
        <div class="level-label" style="background-color: ${badgeBg}; color: ${badgeColor};">${lvlPrefix}${level}</div>
        <div class="input-group">
          <div class="input-item">
            <label>FC <span class="pts" style="color: ${badgeBg};">${fcPts}</span></label>
            <input type="number" min="0" value="${data.fc}" oninput="updateData(${level}, 'fc', this.value)">
          </div>
          <div class="input-item">
            <label>AP <span class="pts" style="color: ${badgeBg};">${apPts}</span></label>
            <input type="number" min="0" value="${data.ap}" oninput="updateData(${level}, 'ap', this.value)">
          </div>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function updateData(level, type, value) {
    const val = parseInt(value) || 0;
    if (currentMode === 'mas') {
      dataMAS[level][type] = val;
    } else {
      dataAPD[level][type] = val;
    }

    const data = currentMode === 'mas' ? dataMAS[level] : dataAPD[level];
    const rowEl = document.getElementById(`row-${currentMode}-${level}`);
    if (rowEl) {
      rowEl.classList.remove('glow-ap', 'glow-fc');
      const newClass = getGlowClass(data);
      if (newClass) rowEl.classList.add(newClass);
    }

    calculate();
  }

  function calculate() {
    let allAchievements = [];
    const maxCount = currentMode === 'mas' ? 39 : 26;
    const data = currentMode === 'mas' ? dataMAS : dataAPD;
    const multiplier = currentMode === 'apd' ? 1.42 : 1.0;
    const modePrefix = currentMode === 'apd' ? 'Lv.APD' : 'Lv.';

    let apCounts = {};
    let fcCounts = {};

    for (const [level, counts] of Object.entries(data)) {
      const lvl = parseInt(level);
      for (let i = 0; i < counts.ap; i++) {
        let dupIdx = apCounts[lvl] || 0;
        apCounts[lvl] = dupIdx + 1;
        allAchievements.push({
          lvl: lvl,
          type: 'AP',
          score: lvl * 8.0 * multiplier,
          key: `${currentMode}_${lvl}_AP_${dupIdx}`
        });
      }
      for (let i = 0; i < counts.fc; i++) {
        let dupIdx = fcCounts[lvl] || 0;
        fcCounts[lvl] = dupIdx + 1;
        allAchievements.push({
          lvl: lvl,
          type: 'FC',
          score: lvl * 7.5 * multiplier,
          key: `${currentMode}_${lvl}_FC_${dupIdx}`
        });
      }
    }

    allAchievements.sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return b.lvl - a.lvl; 
    });

    let finalScore = 0;
    const countedNumber = Math.min(allAchievements.length, maxCount);
    for(let i = 0; i < countedNumber; i++){
      finalScore += allAchievements[i].score;
    }

    const infoBox = document.getElementById('info-box');
    
    if (allAchievements.length > maxCount) {
      const excluded = allAchievements.slice(maxCount);
      let excludedMap = {};
      
      excluded.forEach(ex => {
        let key = `${ex.lvl}-${ex.type}`;
        if (!excludedMap[key]) excludedMap[key] = { lvl: ex.lvl, type: ex.type, count: 0 };
        excludedMap[key].count++;
      });
      
      let msgTexts = [];
      for (let key in excludedMap) {
        let ex = excludedMap[key];
        msgTexts.push(`${modePrefix}${ex.lvl}의 ${ex.type} 성과 ${ex.count}개`);
      }
      
      infoBox.innerHTML = msgTexts.join(', ') + '가 점수 계산에서 제외되었습니다.';
      infoBox.style.display = 'block';
    } else {
      infoBox.style.display = 'none';
    }

    document.getElementById('final-score').innerText = finalScore.toFixed(1);
    updateRank(finalScore);
    renderMajorAchievements(allAchievements);
  }

  function getDefaultBadgeColor(level, mode) {
    if (mode === 'apd') return '#f7cd';
    if (level >= 33) return '#c3fd';
    if (level >= 27 && level <= 32) return '#c3fd';
    if (level === 26) return '#f47d';
    if (level === 25) return '#f47d';
    if (level >= 22 && level <= 24) return '#f47d';
    if (level === 21) return '#fc0d';
    if (level >= 17 && level <= 20) return '#fc0d';
    return '#c3fd';
  }

  function cycleBadgeColor(level, mode, currentColor) {
    if (mode === 'apd' || level >= 33 || (level >= 17 && level <= 20)) {
      return currentColor;
    }
    if (level >= 26 && level <= 32) {
      return currentColor === '#c3fd' ? '#f47d' : '#c3fd';
    }
    if (level === 25) {
      if (currentColor === '#f47d') return '#c3fd';
      if (currentColor === '#c3fd') return '#fc0d';
      return '#f47d';
    }
    if (level >= 21 && level <= 24) {
      return currentColor === '#f47d' ? '#fc0d' : '#f47d';
    }
    return currentColor;
  }

  function renderMajorAchievements(allAchievements) {
    const grid = document.getElementById('jackets-grid');
    grid.innerHTML = '';

    const apList = allAchievements.filter(a => a.type === 'AP');
    const fcList = allAchievements.filter(a => a.type === 'FC');

    const slots = [null, null, null, null, null, null];

    if (apList.length > 0 && fcList.length > 0) {
      for (let i = 0; i < Math.min(3, apList.length); i++) {
        slots[i] = { ...apList[i], rankLabel: `AP #${i + 1}` };
      }
      for (let i = 0; i < Math.min(3, fcList.length); i++) {
        slots[i + 3] = { ...fcList[i], rankLabel: `FC #${i + 1}` };
      }
    } else if (apList.length > 0) {
      for (let i = 0; i < Math.min(6, apList.length); i++) {
        slots[i] = { ...apList[i], rankLabel: `AP #${i + 1}` };
      }
    } else if (fcList.length > 0) {
      for (let i = 0; i < Math.min(6, fcList.length); i++) {
        slots[i] = { ...fcList[i], rankLabel: `FC #${i + 1}` };
      }
    }

    slots.forEach((item) => {
      const slotDiv = document.createElement('div');
      slotDiv.className = 'jacket-slot';

      if (item) {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'jacket-card';
        cardDiv.onclick = () => openJacketModal(item.key);

        const jacketInput = jacketMap[item.key];

        if (jacketInput) {
          const imgEl = document.createElement('img');
          imgEl.className = 'jacket-img';
          imgEl.crossOrigin = 'anonymous';

          let sources = [];
          if (jacketInput.startsWith('http://') || jacketInput.startsWith('https://')) {
            sources = [
              `https://wsrv.nl/?url=${encodeURIComponent(jacketInput)}`,
              jacketInput
            ];
          } else {
            const paddedId = jacketInput;
            sources = [
              `https://wsrv.nl/?url=https://asset.pjsekai.moe/startapp/music/jacket/jacket_s_${paddedId}/jacket_s_${paddedId}.png`,
              `https://wsrv.nl/?url=https://res.sekai.best/sekai-jp-assets/music/jacket/jacket_s_${paddedId}/jacket_s_${paddedId}.png`,
              `https://wsrv.nl/?url=https://res.sekai.best/sekai-jp-assets/music/jacket/jacket_s_${paddedId}_rip/jacket_s_${paddedId}.png`,
              `https://asset.pjsekai.moe/startapp/music/jacket/jacket_s_${paddedId}/jacket_s_${paddedId}.png`,
              `https://res.sekai.best/sekai-jp-assets/music/jacket/jacket_s_${paddedId}/jacket_s_${paddedId}.png`
            ];
          }

          let currentSrcIndex = 0;
          imgEl.src = sources[0];

          imgEl.onerror = () => {
            currentSrcIndex++;
            if (currentSrcIndex < sources.length) {
              if (!sources[currentSrcIndex].includes('wsrv.nl')) {
                imgEl.removeAttribute('crossorigin');
              }
              imgEl.src = sources[currentSrcIndex];
            }
          };

          cardDiv.appendChild(imgEl);
          
          const shadowDiv = document.createElement('div');
          shadowDiv.className = 'jacket-shadow';
          cardDiv.appendChild(shadowDiv);
        } else {
          const addBtn = document.createElement('button');
          addBtn.className = 'btn-add-jacket';
          addBtn.innerText = '추가';
          addBtn.onclick = (e) => {
            e.stopPropagation();
            openJacketModal(item.key);
          };
          cardDiv.appendChild(addBtn);
        }

        let defaultColor = getDefaultBadgeColor(item.lvl, currentMode);
        let currentColor = badgeColorState[item.key] || defaultColor;
        let textColor = (currentColor === '#fc0') ? '#121212' : '#ffffff';

        const badgeDiv = document.createElement('div');
        badgeDiv.className = 'card-level-badge';
        badgeDiv.style.backgroundColor = currentColor;
        badgeDiv.style.color = textColor;
        badgeDiv.innerText = currentMode === 'apd' ? `APD${item.lvl}` : item.lvl;

        badgeDiv.onclick = (e) => {
          e.stopPropagation();
          let cur = badgeColorState[item.key] || defaultColor;
          const nextColor = cycleBadgeColor(item.lvl, currentMode, cur);
          badgeColorState[item.key] = nextColor;
          badgeDiv.style.backgroundColor = nextColor;
          badgeDiv.style.color = (nextColor === '#fc0') ? '#121212' : '#ffffff';
        };

        const rankDiv = document.createElement('div');
        rankDiv.className = 'card-rank-text';
        rankDiv.innerText = item.rankLabel;

        const scoreDiv = document.createElement('div');
        scoreDiv.className = 'card-score-text';
        scoreDiv.innerText = item.score.toFixed(1);
        scoreDiv.style.color = (item.type === 'AP') ? '#81fafa' : '#ff80ab';

        cardDiv.appendChild(badgeDiv);
        cardDiv.appendChild(rankDiv);
        cardDiv.appendChild(scoreDiv);

        slotDiv.appendChild(cardDiv);
      }

      grid.appendChild(slotDiv);
    });
  }

  function openJacketModal(key) {
    activeModalKey = key;
    const modal = document.getElementById('jacket-modal');
    const input = document.getElementById('modal-id-input');
    input.value = jacketMap[key] || '';
    modal.style.display = 'flex';
    input.focus();
  }

  function closeJacketModal() {
    document.getElementById('jacket-modal').style.display = 'none';
    activeModalKey = null;
  }

  function submitJacketId() {
    if (!activeModalKey) return;
    const inputVal = document.getElementById('modal-id-input').value.trim();
    if (inputVal !== '') {
      if (inputVal.startsWith('http://') || inputVal.startsWith('https://')) {
        jacketMap[activeModalKey] = inputVal;
      } else {
        let cleanId = inputVal.replace(/[^0-9]/g, '');
        if (cleanId.length > 0) {
          let paddedId = cleanId.padStart(3, '0');
          jacketMap[activeModalKey] = paddedId;
        } else {
          delete jacketMap[activeModalKey];
        }
      }
    } else {
      delete jacketMap[activeModalKey];
    }
    closeJacketModal();
    calculate();
  }

  function deleteJacketId() {
    if (!activeModalKey) return;
    delete jacketMap[activeModalKey];
    closeJacketModal();
    calculate();
  }

  function updateRank(score) {
    let currentRank = "언랭크";
    let nextRankName = ranks[0].name;
    let scoreNeeded = ranks[0].min - score;

    for (let i = 0; i < ranks.length; i++) {
      if (score >= ranks[i].min) {
        currentRank = ranks[i].name;
        if (i < ranks.length - 1) {
          nextRankName = ranks[i+1].name;
          scoreNeeded = ranks[i+1].min - score;
        } else {
          nextRankName = "최고 등급 달성";
          scoreNeeded = 0;
        }
      }
    }

    document.getElementById('final-rank').innerText = currentRank;
    if (nextRankName === "최고 등급 달성") {
      document.getElementById('next-rank').innerText = "최고 등급에 도달했습니다!";
    } else {
      document.getElementById('next-rank').innerText = `${nextRankName}까지 남은 점수: ${scoreNeeded.toFixed(1)}점`;
    }
  }

  function saveData() {
    const saveData = {
      mas: dataMAS,
      apd: dataAPD,
      nickname: document.getElementById('nickname-input').value,
      jacketMap: jacketMap,
      badgeColorState: badgeColorState
    };
    const blob = new Blob([JSON.stringify(saveData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'sekai_force_data.json';
    link.click();
    URL.revokeObjectURL(url);
  }

  function loadData() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json';
    fileInput.onchange = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const rawData = JSON.parse(e.target.result);
          if (rawData.mas) Object.assign(dataMAS, rawData.mas);
          if (rawData.apd) Object.assign(dataAPD, rawData.apd);
          if (rawData.nickname !== undefined) document.getElementById('nickname-input').value = rawData.nickname;

          if (rawData.jacketMap) Object.assign(jacketMap, rawData.jacketMap);
          if (rawData.badgeColorState) Object.assign(badgeColorState, rawData.badgeColorState);

          renderInputs();
          calculate();
          alert('기록을 성공적으로 불러왔습니다.');
        } catch (err) {
          alert('JSON 파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    };
    fileInput.click();
  }

  function resetData() {
    if (!confirm("모든 입력 내역을 초기화하시겠습니까?")) return;
    for (let i = 17; i <= 37; i++) dataMAS[i] = { fc: 0, ap: 0 };
    for (let i = 24; i <= 38; i++) dataAPD[i] = { fc: 0, ap: 0 };
    for (let key in jacketMap) delete jacketMap[key];
    for (let key in badgeColorState) delete badgeColorState[key];
    
    document.getElementById('nickname-input').value = '';
    renderInputs();
    calculate();
  }

  function captureScreen() {
    const btnGroup = document.getElementById('action-buttons');
    btnGroup.style.display = 'none';

    const captureArea = document.getElementById('capture-area');
    const inputContainer = document.getElementById('input-container');
    const leftPanel = document.querySelector('.left-panel');
    const rightPanel = document.querySelector('.right-panel');
    const contentWrapper = document.querySelector('.content-wrapper');

    const firstRow = document.querySelector('.row');
    const rowWidth = firstRow ? firstRow.offsetWidth : 260;
    
    inputContainer.style.gridTemplateColumns = `repeat(2, ${rowWidth}px)`;
    inputContainer.style.width = `${rowWidth * 2 + 12}px`;
    leftPanel.style.flex = '0 0 auto';

    rightPanel.style.width = '340px';
    rightPanel.style.flex = '0 0 340px';

    contentWrapper.style.gap = '20px';
    captureArea.style.width = 'fit-content';

    const rows = document.querySelectorAll('.row');
    const hiddenRows = [];
    const inputs = document.querySelectorAll('input[type="number"]');
    const hiddenInputs = [];

    rows.forEach(row => {
      if (!row.classList.contains('glow-ap') && !row.classList.contains('glow-fc')) {
        row.classList.add('capture-hide');
        hiddenRows.push(row);
      }
    });

    inputs.forEach(input => {
      if (input.value === '0' || input.value === '') {
        input.dataset.originalValue = input.value; 
        input.value = ''; 
        hiddenInputs.push(input);
      }
    });

    const nicknameInput = document.getElementById('nickname-input');
    const originalNickVal = nicknameInput.value;

    const scoreElement = document.getElementById('final-score');
    const currentScoreText = scoreElement ? scoreElement.innerText : '0.0';

    const imgs = captureArea.querySelectorAll('img');
    const imgPromises = Array.from(imgs).map(img => {
      if (img.complete) return Promise.resolve();
      return new Promise(resolve => {
        img.onload = resolve;
        img.onerror = resolve;
      });
    });

    Promise.all(imgPromises).then(() => {
      html2canvas(captureArea, {
        backgroundColor: '#121212', 
        scale: 2, 
        useCORS: true,
        allowTaint: false,
        onclone: (clonedDoc) => {
          const clonedRightPanel = clonedDoc.querySelector('.right-panel');
          if (clonedRightPanel) {
            clonedRightPanel.style.width = '340px';
            clonedRightPanel.style.flex = '0 0 340px';
          }

          const clonedSlots = clonedDoc.querySelectorAll('.jacket-slot');
          clonedSlots.forEach(slot => {
            const size = slot.offsetWidth;
            if (size > 0) {
              slot.style.height = `${size}px`;
              const card = slot.querySelector('.jacket-card');
              if (card) card.style.height = `${size}px`;
              const shadow = slot.querySelector('.jacket-shadow');
              if (shadow) {
                shadow.style.position = 'absolute';
                shadow.style.top = '0px';
                shadow.style.left = '0px';
                shadow.style.width = `${size}px`;
                shadow.style.height = `${size}px`;
              }
            }
          });

          const clonedScore = clonedDoc.getElementById('final-score');
          if (clonedScore) {
            clonedScore.innerText = currentScoreText;
          }
          
          const clonedContainer = clonedDoc.getElementById('input-container');
          if (clonedContainer) {
            clonedContainer.style.gridTemplateColumns = `repeat(2, ${rowWidth}px)`;
            clonedContainer.style.width = `${rowWidth * 2 + 12}px`;
          }

          const clonedLeftPanel = clonedDoc.querySelector('.left-panel');
          if (clonedLeftPanel) {
            clonedLeftPanel.style.flex = '0 0 auto';
          }

          const clonedContentWrapper = clonedDoc.querySelector('.content-wrapper');
          if (clonedContentWrapper) {
            clonedContentWrapper.style.gap = '20px';
          }

          const clonedCaptureArea = clonedDoc.getElementById('capture-area');
          if (clonedCaptureArea) {
            clonedCaptureArea.style.width = 'fit-content';
          }

          const clonedInfoBox = clonedDoc.getElementById('info-box');
          if (clonedInfoBox && clonedInfoBox.style.display !== 'none' && clonedLeftPanel) {
            clonedInfoBox.parentNode.removeChild(clonedInfoBox);
            clonedInfoBox.style.marginTop = '15px';
            clonedLeftPanel.appendChild(clonedInfoBox);
          }

          const clonedInputs = clonedDoc.querySelectorAll('input[type="number"]');
          clonedInputs.forEach(input => {
            if (input.value === '0') {
              input.value = '';
            }
          });

          const clonedNick = clonedDoc.getElementById('nickname-input');
          if (clonedNick) {
            const nickParent = clonedNick.parentNode;
            const div = clonedDoc.createElement('div');
            div.style.fontFamily = "'Cafe24SurroundAir', sans-serif";
            div.style.color = '#fff';
            div.style.fontSize = '16px';
            div.style.fontWeight = 'bold';
            div.style.padding = '8px 0';
            div.innerText = originalNickVal.trim() || "세카이의 주민";
            nickParent.replaceChild(div, clonedNick);
          }
        }
      }).then(canvas => {
        btnGroup.style.display = 'flex';

        inputContainer.style.gridTemplateColumns = '';
        inputContainer.style.width = '';
        leftPanel.style.flex = '';
        rightPanel.style.width = '';
        rightPanel.style.flex = '';
        contentWrapper.style.gap = '';
        captureArea.style.width = '';
        
        hiddenRows.forEach(row => row.classList.remove('capture-hide'));
        hiddenInputs.forEach(input => {
          input.value = input.dataset.originalValue || '0';
        });

        const link = document.createElement('a');
        link.download = 'SEKAI_FORCE_Result.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        console.error("캡처 중 오류 발생:", err);
        btnGroup.style.display = 'flex';

        inputContainer.style.gridTemplateColumns = '';
        inputContainer.style.width = '';
        leftPanel.style.flex = '';
        rightPanel.style.width = '';
        rightPanel.style.flex = '';
        contentWrapper.style.gap = '';
        captureArea.style.width = '';

        hiddenRows.forEach(row => row.classList.remove('capture-hide'));
        hiddenInputs.forEach(input => {
          input.value = input.dataset.originalValue || '0';
        });
        alert('이미지 저장에 실패했습니다.');
      });
    });
  }

  window.onload = init;
</script>
