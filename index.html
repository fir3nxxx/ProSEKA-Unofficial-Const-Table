<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEKAI FORCE Calculator</title>
<style>
  @font-face {
    font-family: 'Cafe24SurroundAir';
    src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Cafe24Surround';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  } 

  body {
    font-family: 'Cafe24SurroundAir', sans-serif;
    background-color: #121212;
    color: #ffffff;
    margin: 0;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
  }
  .main-container {
    max-width: 1300px;
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
    border-radius: 12px;
    background-color: #121212; 
  }
  h1 {
    text-align: center;
    color: #0bc;
    font-size: 28px;
    margin-bottom: 30px;
    font-weight: 800;
  }
  .content-wrapper {
    display: flex;
    gap: 30px;
    align-items: flex-start;
  }
  .left-panel {
    flex: 3;
    background: #1e1e1e;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .right-panel {
    flex: 1;
    position: sticky;
    top: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    min-width: 320px;
  }
  .tabs {
    display: flex;
    margin-bottom: 20px;
    border-bottom: 2px solid #333;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
    color: #888;
    transition: 0.3s;
  }
  .tab.active {
    color: #0bc;
    border-bottom: 2px solid #0bc;
  }

  .horizontal-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #252525;
    border-radius: 8px;
    border: 1px solid #333;
    transition: all 0.3s ease;
    gap: 8px;
  }
  
  .row.glow-ap {
    border-color: #81fafa;
    background: linear-gradient(135deg, rgba(129, 242, 250, 0.15), rgba(129, 246, 250, 0.05));
    box-shadow: 0 0 12px rgba(129, 246, 250, 0.4);
  }
  .row.glow-fc {
    border-color: #ff80ab;
    background: linear-gradient(135deg, rgba(255, 128, 171, 0.15), rgba(255, 128, 171, 0.05));
    box-shadow: 0 0 12px rgba(255, 128, 171, 0.4);
  }

  .level-label {
    font-size: 13px;
    font-weight: bold;
    padding: 4px 6px;
    border-radius: 6px;
    text-align: center;
    min-width: 75px;
    box-sizing: border-box;
    white-space: nowrap;
  }
  .input-group {
    display: flex;
    gap: 10px;
  }
  .input-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .input-item label {
    font-size: 12px;
    color: #aaa;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pts {
    font-size: 11px;
    margin-top: 2px;
  }
  input[type="number"], input[type="text"] {
    font-family: inherit; 
    background: #121212;
    border: 1px solid #555;
    color: #fff;
    border-radius: 6px;
  }
  input[type="number"] {
    width: 45px;
    padding: 6px;
    text-align: center;
    font-size: 14px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    box-sizing: border-box;
  }
  input:focus {
    outline: none;
    border-color: #0bc;
  }
  
  .nickname-box {
    background: #1e1e1e;
    padding: 15px 20px;
    border-radius: 12px;
    border: 1px solid #333;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .nickname-container {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .nickname-input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .nickname-input-group label {
    font-size: 14px;
    color: #aaa;
    font-weight: bold;
    margin: 0;
  }

  .profile-btn {
    width: 60px;
    height: 60px;
    min-width: 60px;
    border-radius: 50%;
    background-color: #333;
    border: 2px solid #555;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, background-color 0.2s;
    box-sizing: border-box;
  }
  .profile-btn:hover {
    border-color: #0bc;
  }
  .profile-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .profile-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    max-height: 600px;
    overflow-y: auto;
    padding: 5px;
    box-sizing: border-box;
  }
  .profile-option {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background-color: #252525;
    border: 2px solid #444;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #888;
    transition: transform 0.2s, border-color 0.2s;
    box-sizing: border-box;
    min-width: 0;
  }
  .profile-option:hover {
    transform: scale(1.05);
    border-color: #0bc;
  }
  .profile-option img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .result-box {
    padding: 25px 20px;
    background: #1e1e1e;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    border: 1px solid #333;
  }
  .result-title {
    font-size: 16px;
    color: #aaa;
  }
  .result-score {
    font-size: 44px;
    font-weight: bold;
    background: linear-gradient(90deg, #3cb, #0bc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 15px 0;
  }
  .result-score .decimal {
    font-size: 0.67em;
  }
  .result-rank {
    font-size: 20px;
    color: #fff;
    font-weight: bold;
  }
  .next-rank {
    font-size: 13px;
    color: #888;
    margin-top: 10px;
  }

  .major-achievements-box {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #333;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .major-achievements-title {
    font-size: 14px;
    color: #aaa;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .jackets-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    width: 100%;
  }
  .jacket-slot {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    box-sizing: border-box;
  }
  .jacket-card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 8px;
    overflow: hidden;
    background-color: #252525;
    display: block;
    cursor: pointer;
  }
  .jacket-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  .jacket-shadow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .card-level-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 11px;
    font-family: 'Cafe24Surround', sans-serif;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    z-index: 2;
  }
  .card-rank-text {
    position: absolute;
    bottom: 6px;
    left: 8px;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    z-index: 2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
  .card-score-text {
    position: absolute;
    bottom: 6px;
    right: 6px;
    font-size: 11px;
    font-weight: bold;
    z-index: 2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
  .btn-add-jacket {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    padding: 3px 10px;
    font-size: 20px;
    font-weight: bold;
    background-color: #333; 
    color: #ddd;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-add-jacket:hover {
    background: #444;
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.75);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .modal-content {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #444;
    width: 380px;
    max-width: 90vw;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    box-sizing: border-box;
  }
  .modal-content h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 16px;
    color: #0bc;
  }
  .modal-footer {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-find-link {
    color: #aaa;
    font-size: 12px;
    text-decoration: underline;
  }
  .modal-find-link:hover {
    color: #0bc;
  }
  .modal-buttons {
    display: flex;
    gap: 6px;
  }

  .info-box {
    display: none;
    background: rgba(255, 235, 59, 0.1);
    border: 1px solid #ffeb3b;
    color: #ffd600;
    padding: 12px 15px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    font-weight: bold;
    word-break: keep-all;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    font-family: inherit; 
    flex: 1;
    min-width: 45%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-save { background-color: #0bc; color: #fff; }
  .btn-save:hover { background-color: #0096A3; }
  .btn-load { background-color: #333; color: #ddd; border: 1px solid #555; }
  .btn-load:hover { background-color: #444; }
  .btn-reset { background-color: #f44336; color: #fff; }
  .btn-reset:hover { background-color: #d32f2f; }

  @media (max-width: 1100px) {
    .content-wrapper { flex-direction: column; }
    .right-panel { position: static; width: 100%; }
    .horizontal-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .horizontal-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="main-container">
  <h1><span style="font-family: 'Cafe24Surround', sans-serif;">SEKAI FORCE Calculator</span></h1>
  
  <div class="content-wrapper">
    <div class="left-panel">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('mas', event)">MASTER 이하 (39곡)</div>
        <div class="tab" onclick="switchTab('apd', event)">APPEND (26곡)</div>
      </div>
      <div id="input-container" class="horizontal-grid">
        <!-- JS 동적 생성 -->
      </div>
    </div>

    <div class="right-panel">
      <div class="nickname-box">
        <div class="nickname-container">
          <div class="profile-btn" id="profile-btn" onclick="openProfileModal()">
            <img id="profile-img" src="" alt="프로필">
          </div>
          <div class="nickname-input-group">
            <label for="nickname-input">닉네임</label>
            <input type="text" id="nickname-input" placeholder="세카이의 주민">
          </div>
        </div>
      </div>

      <div class="result-box">
        <div class="result-title">최종 SEKAI FORCE</div>
        <div class="result-score" id="final-score">0<span class="decimal">.0</span></div>
        <div class="result-rank" id="final-rank">UNRANKED</div>
        <div class="next-rank" id="next-rank">다음 등급까지 남은 점수: 2000.0</div>
      </div>

      <div class="major-achievements-box">
        <div class="major-achievements-title">주요 성과</div>
        <div class="jackets-grid" id="jackets-grid">
          <!-- JS 동적 생성 -->
        </div>
      </div>

      <div id="info-box" class="info-box"></div>

      <div class="btn-group" id="action-buttons">
        <button class="btn btn-save" onclick="saveData()">기록 저장</button>
        <button class="btn btn-load" onclick="loadData()">불러오기</button>
        <button class="btn btn-reset" onclick="resetData()">내역 초기화</button>
      </div>
    </div>
  </div>
</div>

<div id="profile-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h3>프로필 사진 선택</h3>
    <div class="profile-grid" id="profile-grid">
      <!-- JS 동적 생성 -->
    </div>
    <div class="modal-footer" style="justify-content: flex-end; margin-top: 15px;">
      <button class="btn btn-load" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="closeProfileModal()">취소</button>
    </div>
  </div>
</div>

<div id="jacket-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content" style="width: 320px;">
    <h3>자켓 이미지 ID 입력</h3>
    <input type="text" id="modal-id-input" placeholder="ID 입력 (예: 2, 49, 187)" style="width: 100%; padding: 10px; box-sizing: border-box; margin-top: 5px;">
    <div class="modal-footer">
      <a href="https://rilakbest.com/song/list/all" target="_blank" class="modal-find-link">ID 찾기 (#)</a>
      <div class="modal-buttons">
        <button class="btn btn-save" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="submitJacketId()">확인</button>
        <button class="btn btn-reset" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="deleteJacketId()">삭제</button>
        <button class="btn btn-load" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="closeJacketModal()">취소</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 프로필 사진 이미지 링크 목록 (26종)
  const profileImages = [
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_ichika_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_saki_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_honami_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_shiho_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_minori_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_haruka_mini.png",
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_airi_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_shizuku_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_kohane_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_an_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_akito_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_toya_mini.png",
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_tsukasa_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_emu_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_nene_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_rui_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_kanade_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_mafuyu_mini.png",
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_ena_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_mizuki_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_miku_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_rin_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_len_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_luka_mini.png",
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_meiko_mini.png", 
    "https://pjsekai.sega.jp/colorfullive/5th-frontier/assets/images/common/special/icon_kaito_mini.png"
  ];

  let selectedProfileIndex = null;
  let currentMode = 'mas';

  const jacketMap = {};
  const badgeColorState = {};
  let activeModalKey = null;

  const ranks = [
    { name: "BEGINNER I", min: 2000 },
    { name: "BEGINNER II", min: 2500 },
    { name: "BEGINNER III", min: 3000 },
    { name: "BEGINNER IV", min: 3500 },
    { name: "BRONZE I", min: 4000 },
    { name: "BRONZE II", min: 4500 },
    { name: "BRONZE III", min: 5000 },
    { name: "BRONZE IV", min: 5500 },
    { name: "SILVER I", min: 6000 },
    { name: "SILVER II", min: 6250 },
    { name: "SILVER III", min: 6500 },
    { name: "SILVER IV", min: 6750 },
    { name: "GOLD I", min: 7000 },
    { name: "GOLD II", min: 7250 },
    { name: "GOLD III", min: 7500 },
    { name: "GOLD IV", min: 7750 },
    { name: "PLATINA I", min: 8000 },
    { name: "PLATINA II", min: 8250 },
    { name: "PLATINA III", min: 8500 },
    { name: "PLATINA IV", min: 8750 },
    { name: "DIAMOND I", min: 9000 },
    { name: "DIAMOND II", min: 9150 },
    { name: "DIAMOND III", min: 9300 },
    { name: "DIAMOND IV", min: 9450 },
    { name: "RUBY I", min: 9600 },
    { name: "RUBY II", min: 9700 },
    { name: "RUBY III", min: 9800 },
    { name: "RUBY IV", min: 9900 },
    { name: "PEARL I", min: 10000 },
    { name: "PEARL II", min: 10250 },
    { name: "PEARL III", min: 10500 },
    { name: "PEARL IV", min: 10750 },
    { name: "MASTER", min: 11000 }
  ]; 

  const dataMAS = {};
  const dataAPD = {};

  function init() {
    for (let i = 17; i <= 37; i++) dataMAS[i] = { fc: 0, ap: 0 };
    for (let i = 24; i <= 38; i++) dataAPD[i] = { fc: 0, ap: 0 };

    renderInputs();
    renderProfileGrid();
    calculate();
  }

  function renderProfileGrid() {
    const grid = document.getElementById('profile-grid');
    grid.innerHTML = '';
    
    profileImages.forEach((url, idx) => {
      const opt = document.createElement('div');
      opt.className = 'profile-option';
      opt.onclick = () => selectProfile(idx);

      if (url && url.trim() !== '') {
        const img = document.createElement('img');
        img.src = url;
        opt.appendChild(img);
      } else {
        opt.innerText = idx + 1;
      }
      grid.appendChild(opt);
    });
  }

  function openProfileModal() {
    document.getElementById('profile-modal').style.display = 'flex';
  }

  function closeProfileModal() {
    document.getElementById('profile-modal').style.display = 'none';
  }

  function selectProfile(index) {
    selectedProfileIndex = index;
    applyProfile();
    closeProfileModal();
  }

  function applyProfile() {
    const imgEl = document.getElementById('profile-img');
    const btnEl = document.getElementById('profile-btn');

    if (selectedProfileIndex !== null && profileImages[selectedProfileIndex] && profileImages[selectedProfileIndex].trim() !== '') {
      imgEl.src = profileImages[selectedProfileIndex];
      imgEl.style.display = 'block';
      btnEl.style.backgroundColor = 'transparent';
    } else {
      imgEl.src = '';
      imgEl.style.display = 'none';
      btnEl.style.backgroundColor = '#333';
    }
  }

  function switchTab(mode, event) {
    currentMode = mode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    renderInputs();
    calculate();
  }

  function getGlowClass(data) {
    if (data.ap > 0) return 'glow-ap';
    if (data.fc > 0) return 'glow-fc';
    return '';
  }

  function renderInputs() {
    const container = document.getElementById('input-container');
    container.innerHTML = '';
    
    let levels = currentMode === 'mas' 
      ? Object.keys(dataMAS).map(Number).sort((a, b) => b - a)
      : Object.keys(dataAPD).map(Number).sort((a, b) => b - a);

    const multiplier = currentMode === 'apd' ? 1.5 : 1.0;
    const lvlPrefix = currentMode === 'apd' ? 'Lv.APD' : 'Lv.';

    levels.forEach(level => {
      const data = currentMode === 'mas' ? dataMAS[level] : dataAPD[level];
      const fcPts = (level * 7.5 * multiplier).toFixed(1);
      const apPts = (level * 8.0 * multiplier).toFixed(1);
      const glowClass = getGlowClass(data);
      
      let badgeBg = '';
      let badgeColor = '#fff';
      if (currentMode === 'mas') {
        if (level >= 27 && level <= 37) {
          badgeBg = '#c3f';
        } else if (level >= 22 && level <= 26) {
          badgeBg = '#f47';
        } else if (level >= 17 && level <= 21) {
          badgeBg = '#fc0';
          badgeColor = '#121212';
        }
      } else {
        badgeBg = '#f7c';
      }
      
      const row = document.createElement('div');
      row.className = `row ${glowClass}`;
      row.id = `row-${currentMode}-${level}`;
      
      row.innerHTML = `
        <div class="level-label" style="background-color: ${badgeBg}; color: ${badgeColor};">${lvlPrefix}${level}</div>
        <div class="input-group">
          <div class="input-item">
            <label>FC <span class="pts" style="color: ${badgeBg};">${fcPts}</span></label>
            <input type="number" min="0" value="${data.fc}" oninput="updateData(${level}, 'fc', this.value)">
          </div>
          <div class="input-item">
            <label>AP <span class="pts" style="color: ${badgeBg};">${apPts}</span></label>
            <input type="number" min="0" value="${data.ap}" oninput="updateData(${level}, 'ap', this.value)">
          </div>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function updateData(level, type, value) {
    const val = parseInt(value) || 0;
    if (currentMode === 'mas') {
      dataMAS[level][type] = val;
    } else {
      dataAPD[level][type] = val;
    }

    const data = currentMode === 'mas' ? dataMAS[level] : dataAPD[level];
    const rowEl = document.getElementById(`row-${currentMode}-${level}`);
    if (rowEl) {
      rowEl.classList.remove('glow-ap', 'glow-fc');
      const newClass = getGlowClass(data);
      if (newClass) rowEl.classList.add(newClass);
    }

    calculate();
  }

  function calculate() {
    let allAchievements = [];
    const maxCount = currentMode === 'mas' ? 39 : 26;
    const data = currentMode === 'mas' ? dataMAS : dataAPD;
    const multiplier = currentMode === 'apd' ? 1.5 : 1.0;
    const modePrefix = currentMode === 'apd' ? 'Lv.APD' : 'Lv.';

    let apCounts = {};
    let fcCounts = {};

    for (const [level, counts] of Object.entries(data)) {
      const lvl = parseInt(level);
      for (let i = 0; i < counts.ap; i++) {
        let dupIdx = apCounts[lvl] || 0;
        apCounts[lvl] = dupIdx + 1;
        allAchievements.push({
          lvl: lvl,
          type: 'AP',
          score: lvl * 8.0 * multiplier,
          key: `${currentMode}_${lvl}_AP_${dupIdx}`
        });
      }
      for (let i = 0; i < counts.fc; i++) {
        let dupIdx = fcCounts[lvl] || 0;
        fcCounts[lvl] = dupIdx + 1;
        allAchievements.push({
          lvl: lvl,
          type: 'FC',
          score: lvl * 7.5 * multiplier,
          key: `${currentMode}_${lvl}_FC_${dupIdx}`
        });
      }
    }

    allAchievements.sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return b.lvl - a.lvl; 
    });

    let finalScore = 0;
    const countedNumber = Math.min(allAchievements.length, maxCount);
    for(let i = 0; i < countedNumber; i++){
      finalScore += allAchievements[i].score;
    }

    const infoBox = document.getElementById('info-box');
    
    // 점수 계산에 포함된 성과 내역 알림 출력
    if (countedNumber > 0) {
      const included = allAchievements.slice(0, countedNumber);
      let includedMap = {};
      
      included.forEach(inc => {
        let key = `${inc.lvl}-${inc.type}`;
        if (!includedMap[key]) includedMap[key] = { lvl: inc.lvl, type: inc.type, count: 0 };
        includedMap[key].count++;
      });
      
      let msgTexts = [];
      for (let key in includedMap) {
        let inc = includedMap[key];
        msgTexts.push(`${modePrefix}${inc.lvl} ${inc.type} ${inc.count}개`);
      }
      
      infoBox.innerHTML = msgTexts.join(' + ') + ` = 총 ${countedNumber}개의 성과가 점수 계산에 포함되었습니다.`;
      infoBox.style.display = 'block';
    } else {
      infoBox.style.display = 'none';
    }

    const [intPart, decPart] = finalScore.toFixed(1).split('.');
    document.getElementById('final-score').innerHTML = `${intPart}<span class="decimal">.${decPart}</span>`;

    updateRank(finalScore);
    renderMajorAchievements(allAchievements);
  }

  function getDefaultBadgeColor(level, mode) {
    if (mode === 'apd') return '#f7c';
    if (level >= 33) return '#c3f';
    if (level >= 27 && level <= 32) return '#c3f';
    if (level === 26) return '#f47';
    if (level === 25) return '#f47';
    if (level >= 22 && level <= 24) return '#f47';
    if (level === 21) return '#fc0';
    if (level >= 17 && level <= 20) return '#fc0';
    return '#c3f';
  }

  function cycleBadgeColor(level, mode, currentColor) {
    if (mode === 'apd' || level >= 33 || (level >= 17 && level <= 20)) {
      return currentColor;
    }
    if (level >= 26 && level <= 32) {
      return currentColor === '#c3f' ? '#f47' : '#c3f';
    }
    if (level === 25) {
      if (currentColor === '#f47') return '#c3f';
      if (currentColor === '#c3f') return '#fc0';
      return '#f47';
    }
    if (level >= 21 && level <= 24) {
      return currentColor === '#f47' ? '#fc0' : '#f47';
    }
    return currentColor;
  }

  function renderMajorAchievements(allAchievements) {
    const grid = document.getElementById('jackets-grid');
    grid.innerHTML = '';

    const apList = allAchievements.filter(a => a.type === 'AP');
    const fcList = allAchievements.filter(a => a.type === 'FC');

    const slots = [null, null, null, null, null, null];

    if (apList.length > 0 && fcList.length > 0) {
      for (let i = 0; i < Math.min(3, apList.length); i++) {
        slots[i] = { ...apList[i], rankLabel: `AP #${i + 1}` };
      }
      for (let i = 0; i < Math.min(3, fcList.length); i++) {
        slots[i + 3] = { ...fcList[i], rankLabel: `FC #${i + 1}` };
      }
    } else if (apList.length > 0) {
      for (let i = 0; i < Math.min(6, apList.length); i++) {
        slots[i] = { ...apList[i], rankLabel: `AP #${i + 1}` };
      }
    } else if (fcList.length > 0) {
      for (let i = 0; i < Math.min(6, fcList.length); i++) {
        slots[i] = { ...fcList[i], rankLabel: `FC #${i + 1}` };
      }
    }

    slots.forEach((item) => {
      const slotDiv = document.createElement('div');
      slotDiv.className = 'jacket-slot';

      if (item) {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'jacket-card';
        cardDiv.onclick = () => openJacketModal(item.key);

        const jacketId = jacketMap[item.key];

        if (jacketId) {
          const imgEl = document.createElement('img');
          imgEl.className = 'jacket-img';
          imgEl.src = `https://asset.rilaksekai.com/cover/${jacketId}.webp`;
          cardDiv.appendChild(imgEl);
          
          const shadowDiv = document.createElement('div');
          shadowDiv.className = 'jacket-shadow';
          cardDiv.appendChild(shadowDiv);
        } else {
          const addBtn = document.createElement('button');
          addBtn.className = 'btn-add-jacket';
          addBtn.innerText = '+';
          addBtn.onclick = (e) => {
            e.stopPropagation();
            openJacketModal(item.key);
          };
          cardDiv.appendChild(addBtn);
        }

        let defaultColor = getDefaultBadgeColor(item.lvl, currentMode);
        let currentColor = badgeColorState[item.key] || defaultColor;
        let textColor = (currentColor === '#fc0') ? '#121212' : '#ffffff';

        const badgeDiv = document.createElement('div');
        badgeDiv.className = 'card-level-badge';
        badgeDiv.style.backgroundColor = currentColor;
        badgeDiv.style.color = textColor;
        badgeDiv.innerText = currentMode === 'apd' ? `APD${item.lvl}` : item.lvl;

        badgeDiv.onclick = (e) => {
          e.stopPropagation();
          let cur = badgeColorState[item.key] || defaultColor;
          const nextColor = cycleBadgeColor(item.lvl, currentMode, cur);
          badgeColorState[item.key] = nextColor;
          badgeDiv.style.backgroundColor = nextColor;
          badgeDiv.style.color = (nextColor === '#fc0') ? '#121212' : '#ffffff';
        };

        const rankDiv = document.createElement('div');
        rankDiv.className = 'card-rank-text';
        rankDiv.innerText = item.rankLabel;

        const scoreDiv = document.createElement('div');
        scoreDiv.className = 'card-score-text';
        scoreDiv.innerText = item.score.toFixed(1);
        scoreDiv.style.color = (item.type === 'AP') ? '#81fafa' : '#ff80ab';

        cardDiv.appendChild(badgeDiv);
        cardDiv.appendChild(rankDiv);
        cardDiv.appendChild(scoreDiv);

        slotDiv.appendChild(cardDiv);
      }

      grid.appendChild(slotDiv);
    });
  }

  function openJacketModal(key) {
    activeModalKey = key;
    const modal = document.getElementById('jacket-modal');
    const input = document.getElementById('modal-id-input');
    input.value = jacketMap[key] || '';
    modal.style.display = 'flex';
    input.focus();
  }

  function closeJacketModal() {
    document.getElementById('jacket-modal').style.display = 'none';
    activeModalKey = null;
  }

  function submitJacketId() {
    if (!activeModalKey) return;
    const inputVal = document.getElementById('modal-id-input').value.trim();
    if (inputVal !== '') {
      let paddedId = String(inputVal);
      while (paddedId.length < 3) {
        paddedId = '0' + paddedId;
      }
      jacketMap[activeModalKey] = paddedId;
    } else {
      delete jacketMap[activeModalKey];
    }
    closeJacketModal();
    calculate();
  }

  function deleteJacketId() {
    if (!activeModalKey) return;
    delete jacketMap[activeModalKey];
    closeJacketModal();
    calculate();
  }

  function updateRank(score) {
    let currentRank = "UNRANKED";
    let nextRankName = ranks[0].name;
    let scoreNeeded = ranks[0].min - score;

    for (let i = 0; i < ranks.length; i++) {
      if (score >= ranks[i].min) {
        currentRank = ranks[i].name;
        if (i < ranks.length - 1) {
          nextRankName = ranks[i+1].name;
          scoreNeeded = ranks[i+1].min - score;
        } else {
          nextRankName = "최고 등급 달성";
          scoreNeeded = 0;
        }
      }
    }

    document.getElementById('final-rank').innerText = currentRank;
    if (nextRankName === "최고 등급 달성") {
      document.getElementById('next-rank').innerText = "최고 등급에 도달했습니다!";
    } else {
      document.getElementById('next-rank').innerText = `${nextRankName}까지 남은 점수: ${scoreNeeded.toFixed(1)}점`;
    }
  }

  function saveData() {
    const saveData = {
      mas: dataMAS,
      apd: dataAPD,
      nickname: document.getElementById('nickname-input').value,
      selectedProfileIndex: selectedProfileIndex,
      jacketMap: jacketMap,
      badgeColorState: badgeColorState
    };
    const blob = new Blob([JSON.stringify(saveData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'sekai_force_data.json';
    link.click();
    URL.revokeObjectURL(url);
  }

  function loadData() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json';
    fileInput.onchange = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const rawData = JSON.parse(e.target.result);
          if (rawData.mas) Object.assign(dataMAS, rawData.mas);
          if (rawData.apd) Object.assign(dataAPD, rawData.apd);
          if (rawData.nickname !== undefined) document.getElementById('nickname-input').value = rawData.nickname;

          if (rawData.selectedProfileIndex !== undefined) {
            selectedProfileIndex = rawData.selectedProfileIndex;
            applyProfile();
          }

          if (rawData.jacketMap) Object.assign(jacketMap, rawData.jacketMap);
          if (rawData.badgeColorState) Object.assign(badgeColorState, rawData.badgeColorState);

          renderInputs();
          calculate();
          alert('기록을 성공적으로 불러왔습니다.');
        } catch (err) {
          alert('JSON 파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    };
    fileInput.click();
  }

  function resetData() {
    if (!confirm("모든 입력 내역을 초기화하시겠습니까?")) return;
    for (let i = 17; i <= 37; i++) dataMAS[i] = { fc: 0, ap: 0 };
    for (let i = 24; i <= 38; i++) dataAPD[i] = { fc: 0, ap: 0 };
    for (let key in jacketMap) delete jacketMap[key];
    for (let key in badgeColorState) delete badgeColorState[key];
    
    selectedProfileIndex = null;
    applyProfile();

    document.getElementById('nickname-input').value = '';
    renderInputs();
    calculate();
  }

  window.onload = init;
</script>
</body>
</html>
