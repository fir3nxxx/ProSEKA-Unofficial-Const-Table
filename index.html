<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEKAI RATING Calculator</title>
<style>
  @font-face {
    font-family: 'Cafe24SurroundAir';
    src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Cafe24Surround';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  } 

  body {
    font-family: 'Cafe24SurroundAir', sans-serif;
    background-color: #121212;
    color: #ffffff;
    margin: 0;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
  }
  .main-container {
    max-width: 1300px;
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
    border-radius: 12px;
    background-color: #121212; 
  }
  h1 {
    text-align: center;
    color: #0bc;
    font-size: 28px;
    margin-bottom: 30px;
    font-weight: 800;
  }
  .content-wrapper {
    display: flex;
    gap: 30px;
    align-items: flex-start;
  }
  .left-panel {
    flex: 3;
    background: #1e1e1e;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .right-panel {
    flex: 1;
    position: sticky;
    top: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    min-width: 320px;
  }
  .tabs {
    display: flex;
    margin-bottom: 20px;
    border-bottom: 2px solid #333;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
    color: #888;
    transition: 0.3s;
  }
  .tab.active {
    color: #0bc;
    border-bottom: 2px solid #0bc;
  }

  .horizontal-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #252525;
    border-radius: 8px;
    border: 1px solid #333;
    transition: all 0.3s ease;
    gap: 8px;
  }
  
  .row.glow-ap {
    border-color: #81fafa;
    background: linear-gradient(135deg, rgba(129, 242, 250, 0.15), rgba(129, 246, 250, 0.05));
    box-shadow: 0 0 12px rgba(129, 246, 250, 0.4);
  }
  .row.glow-fc {
    border-color: #ff80ab;
    background: linear-gradient(135deg, rgba(255, 128, 171, 0.15), rgba(255, 128, 171, 0.05));
    box-shadow: 0 0 12px rgba(255, 128, 171, 0.4);
  }

  .level-label {
    font-size: 13px;
    font-weight: bold;
    padding: 4px 6px;
    border-radius: 6px;
    text-align: center;
    min-width: 75px;
    box-sizing: border-box;
    white-space: nowrap;
  }
  .input-group {
    display: flex;
    gap: 10px;
  }
  .input-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .input-item label {
    font-size: 12px;
    color: #aaa;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pts {
    font-size: 11px;
    margin-top: 2px;
  }
  input[type="number"], input[type="text"], select {
    font-family: inherit; 
    background: #121212;
    border: 1px solid #555;
    color: #fff;
    border-radius: 6px;
  }
  input[type="number"] {
    width: 45px;
    padding: 6px;
    text-align: center;
    font-size: 14px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    box-sizing: border-box;
  }
  select {
    width: 100%;
    padding: 8px;
    font-size: 13px;
    box-sizing: border-box;
    cursor: pointer;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #0bc;
  }
  
  .nickname-box {
    background: #1e1e1e;
    padding: 15px 20px;
    border-radius: 12px;
    border: 1px solid #333;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .nickname-container {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .nickname-input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .nickname-input-group label {
    font-size: 14px;
    color: #aaa;
    font-weight: bold;
    margin: 0;
  }

  .profile-btn {
    width: 60px;
    height: 60px;
    min-width: 60px;
    border-radius: 50%;
    background-color: #333;
    border: 2px solid #555;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, background-color 0.2s;
    box-sizing: border-box;
  }
  .profile-btn:hover {
    border-color: #0bc;
  }
  .profile-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .profile-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    max-height: 600px;
    overflow-y: auto;
    padding: 5px;
    box-sizing: border-box;
  }
  .profile-option {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background-color: #252525;
    border: 2px solid #444;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #888;
    transition: transform 0.2s, border-color 0.2s;
    box-sizing: border-box;
    min-width: 0;
  }
  .profile-option:hover {
    transform: scale(1.05);
    border-color: #0bc;
  }
  .profile-option img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .result-box {
    padding: 25px 20px;
    background: #1e1e1e;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    border: 1px solid #333;
  }
  .result-title {
    font-size: 16px;
    color: #aaa;
  }
  .result-score {
    font-size: 44px;
    font-weight: bold;
    margin: 15px 0;
    transition: color 0.3s ease;
  }
  .result-score .decimal {
    font-size: 0.67em;
  }
  .result-rank {
    font-size: 20px;
    font-weight: bold;
    transition: color 0.3s ease;
  }
  .next-rank {
    font-size: 13px;
    color: #888;
    margin-top: 10px;
  }

  .major-achievements-box {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #333;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    position: relative;
  }
  .major-achievements-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .major-achievements-title {
    font-size: 14px;
    color: #aaa;
    font-weight: bold;
  }
  .settings-btn {
    background: transparent;
    border: none;
    color: #888;
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.2s, background-color 0.2s;
  }
  .settings-btn:hover {
    color: #0bc;
    background-color: #252525;
  }

  .jackets-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
  }
  .jacket-slot {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    box-sizing: border-box;
  }
  .jacket-card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 8px;
    overflow: hidden;
    background-color: #252525;
    display: block;
    cursor: pointer;
  }
  .jacket-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  .jacket-shadow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .card-level-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 11px;
    font-family: 'Cafe24Surround', sans-serif;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    z-index: 2;
  }
  .card-rank-text {
    position: absolute;
    bottom: 6px;
    left: 8px;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    z-index: 2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
  .card-score-text {
    position: absolute;
    bottom: 6px;
    right: 6px;
    font-size: 11px;
    font-weight: bold;
    z-index: 2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
  .btn-add-jacket {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    padding: 3px 10px;
    font-size: 20px;
    font-weight: bold;
    background-color: #333; 
    color: #ddd;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-add-jacket:hover {
    background: #444;
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.75);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .modal-content {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #444;
    width: 380px;
    max-width: 90vw;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    box-sizing: border-box;
  }
  .modal-content h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 16px;
    color: #0bc;
  }
  .modal-footer {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-find-link {
    color: #aaa;
    font-size: 12px;
    text-decoration: underline;
  }
  .modal-find-link:hover {
    color: #0bc;
  }
  .modal-buttons {
    display: flex;
    gap: 6px;
  }

  .info-box {
    display: none;
    background: rgba(255, 235, 59, 0.1);
    border: 1px solid #ffeb3b;
    color: #ffd600;
    padding: 12px 15px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    font-weight: bold;
    word-break: keep-all;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    font-family: inherit; 
    flex: 1;
    min-width: 45%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-save { background-color: #0bc; color: #fff; }
  .btn-save:hover { background-color: #0096A3; }
  .btn-load { background-color: #333; color: #ddd; border: 1px solid #555; }
  .btn-load:hover { background-color: #444; }
  .btn-reset { background-color: #f44336; color: #fff; }
  .btn-reset:hover { background-color: #d32f2f; }

  @media (max-width: 1100px) {
    .content-wrapper { flex-direction: column; }
    .right-panel { position: static; width: 100%; }
    .horizontal-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .horizontal-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="main-container">
  <h1><span style="font-family: 'Cafe24Surround', sans-serif;">SEKAI RATING Calculator</span></h1>
  
  <div class="content-wrapper">
    <div class="left-panel">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('mas', event)">MASTER 이하 (39곡)</div>
        <div class="tab" onclick="switchTab('apd', event)">APPEND (26곡)</div>
      </div>
      <div id="input-container" class="horizontal-grid">
        <!-- JS 동적 생성 -->
      </div>
    </div>

    <div class="right-panel">
      <div class="nickname-box">
        <div class="nickname-container">
          <div class="profile-btn" id="profile-btn" onclick="openProfileModal()">
            <img id="profile-img" src="" alt="프로필">
          </div>
          <div class="nickname-input-group">
            <label for="nickname-input">닉네임</label>
            <input type="text" id="nickname-input" placeholder="세카이의 주민" oninput="saveLocalStorage()">
          </div>
        </div>
      </div>

      <div class="result-box">
        <div class="result-title" id="result-title">최종 SEKAI RATING</div>
        <div class="result-score" id="final-score">0<span class="decimal">.000</span></div>
        <div class="result-rank" id="final-rank">UNRANKED</div>
        <div class="next-rank" id="next-rank">다음 등급까지 남은 점수: 10.000</div>
      </div>

      <div class="major-achievements-box">
        <div class="major-achievements-header">
          <div class="major-achievements-title">주요 성과</div>
          <button class="settings-btn" onclick="openAchievementModal()" title="설정">⚙️</button>
        </div>

        <div class="jackets-grid" id="jackets-grid">
          <!-- JS 동적 생성 -->
        </div>
      </div>

      <div id="info-box" class="info-box"></div>

      <div class="btn-group" id="action-buttons">
        <button class="btn btn-save" onclick="saveData()">기록 저장</button>
        <button class="btn btn-load" onclick="loadData()">불러오기</button>
        <button class="btn btn-reset" onclick="resetData()">내역 초기화</button>
      </div>
    </div>
  </div>
</div>

<div id="profile-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h3>프로필 아이콘 선택<br>(Art by 上倉エク from セカライ5th)</h3>
    <div class="profile-grid" id="profile-grid">
      <!-- JS 동적 생성 -->
    </div>
    <div class="modal-footer" style="justify-content: flex-end; margin-top: 15px;">
      <button class="btn btn-load" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="closeProfileModal()">취소</button>
    </div>
  </div>
</div>

<div id="achievement-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content" style="width: 320px;">
    <h3>주요 성과 표시 설정</h3>
    <div style="margin-bottom: 15px;">
      <label for="achievement-option-select" style="font-size: 13px; color: #aaa; display: block; margin-bottom: 8px;">표시 방식을 선택하세요</label>
      <select id="achievement-option-select" onchange="changeAchievementOption(this.value)">
        <option value="all_9">전체 성과 통합 9개</option>
        <option value="ap6_fc3">AP 성과 6개 & FC 성과 3개</option>
        <option value="ap3_fc6">AP 성과 3개 & FC 성과 6개</option>
      </select>
    </div>
    <div class="modal-footer" style="justify-content: flex-end;">
      <button class="btn btn-save" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="closeAchievementModal()">확인</button>
    </div>
  </div>
</div>

<div id="jacket-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content" style="width: 320px;">
    <h3>자켓 이미지 ID 입력</h3>
    <input type="text" id="modal-id-input" placeholder="ID 입력 예: 2, 49, 187" style="width: 100%; padding: 10px; box-sizing: border-box; margin-top: 5px;">
    <div class="modal-footer">
      <a href="https://rilakbest.com/song/list/all" target="_blank" class="modal-find-link">ID 찾기 #</a>
      <div class="modal-buttons">
        <button class="btn btn-save" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="submitJacketId()">확인</button>
        <button class="btn btn-reset" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="deleteJacketId()">삭제</button>
        <button class="btn btn-load" style="padding: 6px 12px; min-width: auto; font-size: 12px;" onclick="closeJacketModal()">취소</button>
      </div>
    </div>
  </div>
</div>

    { name: "PLATINA IV", min: 16.750, color: "#bee" },
    { name: "DIAMOND I", min: 17.000, color: "#8cf" },
    { name: "DIAMOND II", min: 17.250, color: "#8cf" },
    { name: "DIAMOND III", min: 17.500, color: "#8cf" },
    { name: "DIAMOND IV", min: 17.750, color: "#8cf" },
    { name: "RUBY I", min: 18.000, color: "#f6a" },
    { name: "RUBY II", min: 18.250, color: "#f6a" },
    { name: "RUBY III", min: 18.500, color: "#f6a" },
    { name: "RUBY IV", min: 18.750, color: "#f6a" },
    { name: "MASTER", min: 19.000, color: "#b5f" }
  ];

  const ranksAPD = [
    { name: "BEGINNER I", min: 0.000, color: "#aaa" },
    { name: "BEGINNER II", min: 2.750, color: "#aaa" },
    { name: "BEGINNER III", min: 5.500, color: "#aaa" },
    { name: "BEGINNER IV", min: 8.250, color: "#aaa" },
    { name: "BRONZE I", min: 11.000, color: "#c73" },
    { name: "BRONZE II", min: 11.500, color: "#c73" },
    { name: "BRONZE III", min: 12.000, color: "#c73" },
    { name: "BRONZE IV", min: 12.500, color: "#c73" },
    { name: "SILVER I", min: 13.000, color: "#ddd" },
    { name: "SILVER II", min: 13.500, color: "#ddd" },
    { name: "SILVER III", min: 14.000, color: "#ddd" },
    { name: "SILVER IV", min: 14.500, color: "#ddd" },
    { name: "GOLD I", min: 15.000, color: "#fc5" },
    { name: "GOLD II", min: 15.500, color: "#fc5" },
    { name: "GOLD III", min: 16.000, color: "#fc5" },
    { name: "GOLD IV", min: 16.500, color: "#fc5" },
    { name: "PLATINA I", min: 17.000, color: "#bee" },
    { name: "PLATINA II", min: 17.250, color: "#bee" },
    { name: "PLATINA III", min: 17.500, color: "#bee" },
    { name: "PLATINA IV", min: 17.750, color: "#bee" },
    { name: "DIAMOND I", min: 18.000, color: "#8cf" },
    { name: "DIAMOND II", min: 18.250, color: "#8cf" },
    { name: "DIAMOND III", min: 18.500, color: "#8cf" },
    { name: "DIAMOND IV", min: 18.750, color: "#8cf" },
    { name: "RUBY I", min: 19.000, color: "#f6a" },
    { name: "RUBY II", min: 19.250, color: "#f6a" },
    { name: "RUBY III", min: 19.500, color: "#f6a" },
    { name: "RUBY IV", min: 19.750, color: "#f6a" },
    { name: "MASTER", min: 20.000, color: "#b5f" }
  ];

  const dataMAS = {};
  const dataAPD = {};

  function trunc3(val) {
    return Math.floor((val + 1e-9) * 1000) / 1000;
  }

  function format3(val) {
    return trunc3(val).toFixed(3);
  }

  function init() {
    for (let i = 21; i <= 37; i++) dataMAS[i] = { fc: 0, ap: 0 };
    for (let i = 24; i <= 38; i++) dataAPD[i] = { fc: 0, ap: 0 };

    loadLocalStorage();
    renderInputs();
    renderProfileGrid();
    calculate();
  }

  function saveLocalStorage() {
    const saveData = {
      mas: dataMAS,
      apd: dataAPD,
      nickname: document.getElementById('nickname-input').value,
      selectedProfileIndex: selectedProfileIndex,
      jacketMap: jacketMap,
      badgeColorState: badgeColorState,
      achievementOptions: achievementOptions
    };
    localStorage.setItem('sekai_rating_data', JSON.stringify(saveData));
  }

  function loadLocalStorage() {
    const raw = localStorage.getItem('sekai_rating_data');
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      if (parsed.mas) Object.assign(dataMAS, parsed.mas);
      if (parsed.apd) Object.assign(dataAPD, parsed.apd);
      if (parsed.nickname !== undefined) document.getElementById('nickname-input').value = parsed.nickname;
      if (parsed.selectedProfileIndex !== undefined) {
        selectedProfileIndex = parsed.selectedProfileIndex;
        applyProfile();
      }
      if (parsed.jacketMap) Object.assign(jacketMap, parsed.jacketMap);
      if (parsed.badgeColorState) Object.assign(badgeColorState, parsed.badgeColorState);
      if (parsed.achievementOptions) {
        Object.assign(achievementOptions, parsed.achievementOptions);
      } else if (parsed.achievementOption) {
        achievementOptions.mas = parsed.achievementOption;
        achievementOptions.apd = parsed.achievementOption;
      }
      document.getElementById('achievement-option-select').value = achievementOptions[currentMode];
    } catch (e) {
      console.error('LocalStorage load failed', e);
    }
  }

  function renderProfileGrid() {
    const grid = document.getElementById('profile-grid');
    grid.innerHTML = '';
    
    profileImages.forEach((url, idx) => {
      const opt = document.createElement('div');
      opt.className = 'profile-option';
      opt.onclick = () => selectProfile(idx);

      if (url && url.trim() !== '') {
        const img = document.createElement('img');
        img.src = url;
        opt.appendChild(img);
      } else {
        opt.innerText = idx + 1;
      }
      grid.appendChild(opt);
    });
  }

  function openProfileModal() {
    document.getElementById('profile-modal').style.display = 'flex';
  }

  function closeProfileModal() {
    document.getElementById('profile-modal').style.display = 'none';
  }

  function selectProfile(index) {
    selectedProfileIndex = index;
    applyProfile();
    closeProfileModal();
    saveLocalStorage();
  }

  function applyProfile() {
    const imgEl = document.getElementById('profile-img');
    const btnEl = document.getElementById('profile-btn');

    if (selectedProfileIndex !== null && profileImages[selectedProfileIndex] && profileImages[selectedProfileIndex].trim() !== '') {
      imgEl.src = profileImages[selectedProfileIndex];
      imgEl.style.display = 'block';
      btnEl.style.backgroundColor = 'transparent';
    } else {
      imgEl.src = '';
      imgEl.style.display = 'none';
      btnEl.style.backgroundColor = '#333';
    }
  }

  function switchTab(mode, event) {
    currentMode = mode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    document.getElementById('achievement-option-select').value = achievementOptions[currentMode];

    renderInputs();
    calculate();
  }

  function getGlowClass(data) {
    if (data.ap > 0) return 'glow-ap';
    if (data.fc > 0) return 'glow-fc';
    return '';
  }

  function renderInputs() {
    const container = document.getElementById('input-container');
    container.innerHTML = '';
    
    let levels = currentMode === 'mas' 
      ? Object.keys(dataMAS).map(Number).sort((a, b) => b - a)
      : Object.keys(dataAPD).map(Number).sort((a, b) => b - a);

    const lvlPrefix = currentMode === 'apd' ? 'Lv.APD' : 'Lv.';

    levels.forEach(level => {
      const data = currentMode === 'mas' ? dataMAS[level] : dataAPD[level];
      const fcPts = format3((level / 2) + 1.226);
      const apPts = format3((level / 2) + 2.150);
      const glowClass = getGlowClass(data);
      
      let badgeBg = '';
      let badgeColor = '#fff';
      if (currentMode === 'mas') {
        if (level >= 27 && level <= 37) {
          badgeBg = '#c3f';
        } else if (level >= 21 && level <= 26) {
          badgeBg = '#f47';
        }
      } else {
        badgeBg = '#f7c';
      }
      
      const row = document.createElement('div');
      row.className = `row ${glowClass}`;
      row.id = `row-${currentMode}-${level}`;
      
      row.innerHTML = `
        <div class="level-label" style="background-color: ${badgeBg}; color: ${badgeColor};">${lvlPrefix}${level}</div>
        <div class="input-group">
          <div class="input-item">
            <label>FC <span class="pts" style="color: ${badgeBg};">${fcPts}</span></label>
            <input type="number" min="0" value="${data.fc}" oninput="updateData(${level}, 'fc', this.value)">
          </div>
          <div class="input-item">
            <label>AP <span class="pts" style="color: ${badgeBg};">${apPts}</span></label>
            <input type="number" min="0" value="${data.ap}" oninput="updateData(${level}, 'ap', this.value)">
          </div>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function updateData(level, type, value) {
    const val = parseInt(value) || 0;
    if (currentMode === 'mas') {
      dataMAS[level][type] = val;
    } else {
      dataAPD[level][type] = val;
    }

    const data = currentMode === 'mas' ? dataMAS[level] : dataAPD[level];
    const rowEl = document.getElementById(`row-${currentMode}-${level}`);
    if (rowEl) {
      rowEl.classList.remove('glow-ap', 'glow-fc');
      const newClass = getGlowClass(data);
      if (newClass) rowEl.classList.add(newClass);
    }

    calculate();
    saveLocalStorage();
  }

  function calculate() {
    const titleEl = document.getElementById('result-title');
    if (titleEl) {
      titleEl.innerText = currentMode === 'apd' ? '최종 SEKAI RATING (A)' : '최종 SEKAI RATING';
    }

    let allAchievements = [];
    const divisor = currentMode === 'mas' ? 39 : 26;
    const data = currentMode === 'mas' ? dataMAS : dataAPD;
    const modePrefix = currentMode === 'apd' ? 'Lv.APD' : 'Lv.';

    let apCounts = {};
    let fcCounts = {};

    for (const [level, counts] of Object.entries(data)) {
      const lvl = parseInt(level);
      for (let i = 0; i < counts.ap; i++) {
        let dupIdx = apCounts[lvl] || 0;
        apCounts[lvl] = dupIdx + 1;
        allAchievements.push({
          lvl: lvl,
          type: 'AP',
          score: trunc3((lvl / 2) + 2.150),
          key: `${currentMode}_${lvl}_AP_${dupIdx}`
        });
      }
      for (let i = 0; i < counts.fc; i++) {
        let dupIdx = fcCounts[lvl] || 0;
        fcCounts[lvl] = dupIdx + 1;
        allAchievements.push({
          lvl: lvl,
          type: 'FC',
          score: trunc3((lvl / 2) + 1.226),
          key: `${currentMode}_${lvl}_FC_${dupIdx}`
        });
      }
    }

    allAchievements.sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return b.lvl - a.lvl; 
    });

    let totalSum = 0;
    const countedNumber = Math.min(allAchievements.length, divisor);
    for (let i = 0; i < countedNumber; i++) {
      totalSum += allAchievements[i].score;
    }

    const finalScore = trunc3(totalSum / divisor);

    const infoBox = document.getElementById('info-box');
    
    if (countedNumber > 0) {
      const included = allAchievements.slice(0, countedNumber);
      let includedMap = {};
      
      included.forEach(inc => {
        let key = `${inc.lvl}-${inc.type}`;
        if (!includedMap[key]) includedMap[key] = { lvl: inc.lvl, type: inc.type, count: 0 };
        includedMap[key].count++;
      });
      
      let msgTexts = [];
      for (let key in includedMap) {
        let inc = includedMap[key];
        msgTexts.push(`${modePrefix}${inc.lvl} ${inc.type} ${inc.count}개`);
      }
      
      infoBox.innerHTML = msgTexts.join(' + ') + ` = 총 ${countedNumber}곡 레이팅 계산 반영 완료`;
      infoBox.style.display = 'block';
    } else {
      infoBox.style.display = 'none';
    }

    const formattedStr = format3(finalScore);
    const parts = formattedStr.split('.');
    document.getElementById('final-score').innerHTML = `${parts[0]}<span class="decimal">.${parts[1]}</span>`;

    updateRank(finalScore);
    renderMajorAchievements(allAchievements);
  }

  function updateRank(score) {
    const rankList = currentMode === 'mas' ? ranksMAS : ranksAPD;
    let currentRankObj = rankList[0];
    let nextRankName = rankList[0].name;
    let scoreNeeded = trunc3(rankList[0].min - score);

    for (let i = 0; i < rankList.length; i++) {
      if (score >= rankList[i].min) {
        currentRankObj = rankList[i];
        if (i < rankList.length - 1) {
          nextRankName = rankList[i+1].name;
          scoreNeeded = trunc3(rankList[i+1].min - score);
        } else {
          nextRankName = "최고 등급 달성";
          scoreNeeded = 0;
        }
      }
    }

    const rankEl = document.getElementById('final-rank');
    const scoreEl = document.getElementById('final-score');
    
    rankEl.innerText = currentRankObj.name;
    rankEl.style.color = currentRankObj.color;
    scoreEl.style.color = currentRankObj.color;

    if (nextRankName === "최고 등급 달성") {
      document.getElementById('next-rank').innerText = "최고 등급에 도달했습니다!";
    } else {
      document.getElementById('next-rank').innerText = `${nextRankName}까지 ${format3(scoreNeeded)} 남음`;
    }
  }

  function getDefaultBadgeColor(level, mode) {
    if (mode === 'apd') return '#f7c';
    if (level >= 27) return '#c3f';
    return '#f47';
  }

  function openAchievementModal() {
    document.getElementById('achievement-option-select').value = achievementOptions[currentMode];
    document.getElementById('achievement-modal').style.display = 'flex';
  }

  function closeAchievementModal() {
    document.getElementById('achievement-modal').style.display = 'none';
  }

  function changeAchievementOption(val) {
    achievementOptions[currentMode] = val;
    saveLocalStorage();
    calculate();
  }

  function renderMajorAchievements(allAchievements) {
    const grid = document.getElementById('jackets-grid');
    grid.innerHTML = '';

    const slots = new Array(9).fill(null);
    const currentOption = achievementOptions[currentMode];

    if (currentOption === 'all_9') {
      const top9 = allAchievements.slice(0, 9);
      top9.forEach((item, i) => {
        slots[i] = { ...item, rankLabel: `#${i + 1}` };
      });
    } else if (currentOption === 'ap3_fc6') {
      const apList = allAchievements.filter(a => a.type === 'AP');
      const fcList = allAchievements.filter(a => a.type === 'FC');

      for (let i = 0; i < Math.min(3, apList.length); i++) {
        slots[i] = { ...apList[i], rankLabel: `#P${i + 1}` };
      }
      for (let i = 0; i < Math.min(6, fcList.length); i++) {
        slots[i + 3] = { ...fcList[i], rankLabel: `#F${i + 1}` };
      }
    } else {
      const apList = allAchievements.filter(a => a.type === 'AP');
      const fcList = allAchievements.filter(a => a.type === 'FC');

      for (let i = 0; i < Math.min(6, apList.length); i++) {
        slots[i] = { ...apList[i], rankLabel: `#P${i + 1}` };
      }
      for (let i = 0; i < Math.min(3, fcList.length); i++) {
        slots[i + 6] = { ...fcList[i], rankLabel: `#F${i + 1}` };
      }
    }

    slots.forEach((item) => {
      const slotDiv = document.createElement('div');
      slotDiv.className = 'jacket-slot';

      if (item) {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'jacket-card';
        cardDiv.onclick = () => openJacketModal(item.key);

        const jacketId = jacketMap[item.key];

        if (jacketId) {
          const imgEl = document.createElement('img');
          imgEl.className = 'jacket-img';
          imgEl.src = `https://asset.rilaksekai.com/cover/${jacketId}.webp`;
          cardDiv.appendChild(imgEl);
          
          const shadowDiv = document.createElement('div');
          shadowDiv.className = 'jacket-shadow';
          cardDiv.appendChild(shadowDiv);
        } else {
          const addBtn = document.createElement('button');
          addBtn.className = 'btn-add-jacket';
          addBtn.innerText = '+';
          addBtn.onclick = (e) => {
            e.stopPropagation();
            openJacketModal(item.key);
          };
          cardDiv.appendChild(addBtn);
        }

        let defaultColor = getDefaultBadgeColor(item.lvl, currentMode);
        let currentColor = badgeColorState[item.key] || defaultColor;

        const badgeDiv = document.createElement('div');
        badgeDiv.className = 'card-level-badge';
        badgeDiv.style.backgroundColor = currentColor;
        badgeDiv.style.color = '#ffffff';
        badgeDiv.innerText = currentMode === 'apd' ? `APD${item.lvl}` : item.lvl;

        const rankDiv = document.createElement('div');
        rankDiv.className = 'card-rank-text';
        rankDiv.innerText = item.rankLabel;

        const scoreDiv = document.createElement('div');
        scoreDiv.className = 'card-score-text';
        scoreDiv.innerText = format3(item.score);
        scoreDiv.style.color = (item.type === 'AP') ? '#81fafa' : '#ff80ab';

        cardDiv.appendChild(badgeDiv);
        cardDiv.appendChild(rankDiv);
        cardDiv.appendChild(scoreDiv);

        slotDiv.appendChild(cardDiv);
      }

      grid.appendChild(slotDiv);
    });
  }

  function openJacketModal(key) {
    activeModalKey = key;
    const modal = document.getElementById('jacket-modal');
    const input = document.getElementById('modal-id-input');
    input.value = jacketMap[key] || '';
    modal.style.display = 'flex';
    input.focus();
  }

  function closeJacketModal() {
    document.getElementById('jacket-modal').style.display = 'none';
    activeModalKey = null;
  }

  function submitJacketId() {
    if (!activeModalKey) return;
    const inputVal = document.getElementById('modal-id-input').value.trim();
    if (inputVal !== '') {
      let paddedId = String(inputVal);
      while (paddedId.length < 3) {
        paddedId = '0' + paddedId;
      }
      jacketMap[activeModalKey] = paddedId;
    } else {
      delete jacketMap[activeModalKey];
    }
    closeJacketModal();
    saveLocalStorage();
    calculate();
  }

  function deleteJacketId() {
    if (!activeModalKey) return;
    delete jacketMap[activeModalKey];
    closeJacketModal();
    saveLocalStorage();
    calculate();
  }

  function saveData() {
    const saveData = {
      mas: dataMAS,
      apd: dataAPD,
      nickname: document.getElementById('nickname-input').value,
      selectedProfileIndex: selectedProfileIndex,
      jacketMap: jacketMap,
      badgeColorState: badgeColorState,
      achievementOptions: achievementOptions
    };

    const rawNickname = document.getElementById('nickname-input').value.trim();
    let fileName = 'sekai_rating_data';
    if (rawNickname !== '') {
      const sanitizedNickname = rawNickname.replace(/\s+/g, '_');
      fileName += `_${sanitizedNickname}`;
    }

    const blob = new Blob([JSON.stringify(saveData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${fileName}.json`;
    link.click();
    URL.revokeObjectURL(url);
  }

  function loadData() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json';
    fileInput.onchange = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const rawData = JSON.parse(e.target.result);
          if (rawData.mas) Object.assign(dataMAS, rawData.mas);
          if (rawData.apd) Object.assign(dataAPD, rawData.apd);
          if (rawData.nickname !== undefined) document.getElementById('nickname-input').value = rawData.nickname;

          if (rawData.selectedProfileIndex !== undefined) {
            selectedProfileIndex = rawData.selectedProfileIndex;
            applyProfile();
          }

          if (rawData.jacketMap) Object.assign(jacketMap, rawData.jacketMap);
          if (rawData.badgeColorState) Object.assign(badgeColorState, rawData.badgeColorState);
          if (rawData.achievementOptions) {
            Object.assign(achievementOptions, rawData.achievementOptions);
          } else if (rawData.achievementOption) {
            achievementOptions.mas = rawData.achievementOption;
            achievementOptions.apd = rawData.achievementOption;
          }

          document.getElementById('achievement-option-select').value = achievementOptions[currentMode];

          renderInputs();
          calculate();
          saveLocalStorage();
          alert('기록을 성공적으로 불러왔습니다.');
        } catch (err) {
          alert('JSON 파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    };
    fileInput.click();
  }

  function resetData() {
    if (!confirm("모든 입력 내역을 초기화하시겠습니까?")) return;
    for (let i = 21; i <= 37; i++) dataMAS[i] = { fc: 0, ap: 0 };
    for (let i = 24; i <= 38; i++) dataAPD[i] = { fc: 0, ap: 0 };
    for (let key in jacketMap) delete jacketMap[key];
    for (let key in badgeColorState) delete badgeColorState[key];
    
    selectedProfileIndex = null;
    applyProfile();

    document.getElementById('nickname-input').value = '';
    achievementOptions = { mas: 'all_9', apd: 'all_9' };
    document.getElementById('achievement-option-select').value = 'all_9';

    localStorage.removeItem('sekai_rating_data');
    renderInputs();
    calculate();
  }

  window.onload = init;
</script>
